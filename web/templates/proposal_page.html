<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Proposal</title>
    <link rel="stylesheet" href="/static/style.css?v=4.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f8fa;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-navbar">
        <div class="navbar-container">
            <a href="/freelancer-dashboard" class="navbar-logo">Freeio</a>
            <div class="navbar-menu">
                <a href="/freelancer-dashboard">Dashboard</a>
                <a href="#" onclick="goBack(); return false;">Back to Jobs</a>
            </div>
            <div class="navbar-actions">
                <span id="username" style="color: #fff; margin-right: 15px;"></span>
                <button onclick="logout()" class="btn btn-secondary" style="padding: 8px 16px;">Logout</button>
            </div>
        </div>
    </nav>

    <div style="padding: 40px 20px; background: #f7f8fa; min-height: calc(100vh - 70px);">
        <div style="max-width: 1100px; margin: 0 auto;">
            <div class="content-card">
                <h1 style="margin-top: 0; color: #222; margin-bottom: 10px; font-size: 28px; font-weight: 700;">✍️ Write Your Proposal</h1>
                <p style="color: #666; margin-bottom: 30px;">
                    Craft a compelling proposal to win this job
                </p>

                <div class="job-details" id="jobDetails" style="background: #f7f8fa; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #e5e7eb;">
                    <h3 style="margin-top: 0; color: #222; font-size: 18px; margin-bottom: 20px;">📋 Job Details</h3>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px;">
                        <div>
                            <div style="color: #666; font-size: 13px; margin-bottom: 5px;">Title</div>
                            <div style="color: #222; font-weight: 600;" id="jobTitle">Loading...</div>
                        </div>
                        <div>
                            <div style="color: #666; font-size: 13px; margin-bottom: 5px;">Budget</div>
                            <div style="color: #1DBF73; font-weight: 600; font-size: 18px;" id="jobBudget">Loading...</div>
                        </div>
                        <div>
                            <div style="color: #666; font-size: 13px; margin-bottom: 5px;">Timeline</div>
                            <div style="color: #222; font-weight: 600;" id="jobTimeline">Loading...</div>
                        </div>
                        <div>
                            <div style="color: #666; font-size: 13px; margin-bottom: 5px;">Complexity</div>
                            <div style="color: #222; font-weight: 600;" id="jobComplexity">Loading...</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                        <div style="color: #666; font-size: 13px; margin-bottom: 8px;">Description</div>
                        <p id="jobDescription" style="color: #222; line-height: 1.6; margin: 0;">Loading...</p>
                    </div>
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                        <div style="color: #666; font-size: 13px; margin-bottom: 10px;">Required Skills</div>
                        <div id="jobSkills"></div>
                    </div>
                </div>

                <form onsubmit="submitProposal(event)">
                    <div class="form-group">
                        <label for="coverLetter">Cover Letter *</label>
                        <textarea id="coverLetter" rows="8" required 
                            placeholder="Introduce yourself and explain why you're the best fit for this project..."></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div class="form-group">
                            <label for="proposedBudget">Your Proposed Budget ($) *</label>
                            <input type="number" id="proposedBudget" min="1" required 
                                placeholder="Enter your budget">
                        </div>

                        <div class="form-group">
                            <label for="proposedTimeline">Delivery Timeline (days) *</label>
                            <input type="number" id="proposedTimeline" min="1" required 
                                placeholder="How many days do you need?">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="additionalNotes">Additional Notes (Optional)</label>
                        <textarea id="additionalNotes" rows="4" 
                            placeholder="Any additional information, questions, or requirements..."></textarea>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="button" class="btn btn-secondary" onclick="goBack()">
                            Cancel
                        </button>
                        <button type="submit" class="btn">
                            Submit Proposal
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Wait a moment to ensure session storage is available
        const userId = sessionStorage.getItem('userId');
        const userName = sessionStorage.getItem('username');
        
        if (userName) {
            document.getElementById('username').textContent = userName;
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }
        
        console.log('User ID from session:', userId);
        
        if (!userId || userId === 'null' || userId === 'undefined') {
            console.log('No user ID found, redirecting to login');
            alert('Please login first');
            window.location.href = '/login';
            throw new Error('Not authenticated');
        }

        // Get job ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('job_id');

        if (!jobId) {
            alert('Job ID not found');
            window.location.href = '/freelancer-dashboard';
            throw new Error('No job ID');
        }

        console.log('Loading job:', jobId, 'for user:', userId);

        // Load job details
        async function loadJobDetails() {
            try {
                const response = await fetch(`http://localhost:3000/api/jobs/${jobId}`, {
                    headers: {
                        'X-User-ID': userId
                    }
                });

                const result = await response.json();
                if (result.success && result.job) {
                    const job = result.job;
                    document.getElementById('jobTitle').textContent = job.title;
                    document.getElementById('jobBudget').textContent = `$${job.estimated_cost || job.budget_min} - $${job.budget_max}`;
                    document.getElementById('jobTimeline').textContent = `${job.estimated_days} days`;
                    document.getElementById('jobComplexity').textContent = job.complexity;
                    document.getElementById('jobDescription').textContent = job.description;
                    
                    const skillsDiv = document.getElementById('jobSkills');
                    skillsDiv.innerHTML = job.skills_required.map(skill => 
                        `<span class="skill-tag">${skill}</span>`
                    ).join('');

                    // Set suggested values
                    document.getElementById('proposedBudget').value = job.estimated_cost || job.budget_min;
                    document.getElementById('proposedTimeline').value = job.estimated_days;
                } else {
                    alert('Failed to load job details');
                    goBack();
                }
            } catch (error) {
                console.error('Error loading job:', error);
                alert('Error loading job details');
                goBack();
            }
        }

        async function submitProposal(event) {
            event.preventDefault();

            const coverLetter = document.getElementById('coverLetter').value;
            const proposedBudget = document.getElementById('proposedBudget').value;
            const proposedTimeline = document.getElementById('proposedTimeline').value;
            const additionalNotes = document.getElementById('additionalNotes').value;

            try {
                const response = await fetch(`http://localhost:3000/api/jobs/${jobId}/apply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify({
                        cover_letter: coverLetter,
                        proposed_budget: parseFloat(proposedBudget),
                        proposed_timeline: parseInt(proposedTimeline),
                        additional_notes: additionalNotes
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Proposal submitted successfully! The client will review your application.');
                    window.location.href = '/freelancer-dashboard';
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                console.error('Error submitting proposal:', error);
                alert('Error submitting proposal. Please try again.');
            }
        }

        function goBack() {
            window.location.href = '/freelancer-dashboard';
        }

        // Load job details on page load
        loadJobDetails();
    </script>
</body>
</html>

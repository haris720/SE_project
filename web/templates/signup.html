<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Freelancer Platform</title>
    <link rel="stylesheet" href="/static/style.css?v=4.0">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="top-navbar-container">
            <a href="/" class="navbar-logo">
                <span>🆓</span> Freeio
            </a>
            <div class="navbar-menu">
                <a href="/">Home</a>
                <a href="#">Browse Jobs</a>
                <a href="#">Users</a>
                <a href="#">Blog</a>
                <a href="#">Pages</a>
            </div>
            <div class="navbar-actions">
                <a href="/login" class="navbar-btn navbar-btn-login">Login</a>
                <a href="/signup" class="navbar-btn navbar-btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Register Page Content -->
    <div class="auth-page">
        <div class="auth-card">
            <h1>Register</h1>
            <p class="subtitle">Give your visitor a smooth online experience with a solid UX design</p>
            
            <div class="user-type-tabs">
                <button class="user-tab active" onclick="selectUserType('freelancer')" id="freelancer-btn">
                    👨‍💻 Freelancer
                </button>
                <button class="user-tab" onclick="selectUserType('client')" id="client-btn">
                    💼 Client
                </button>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <input type="hidden" id="userType" value="freelancer">
                
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="Email">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="Password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" required placeholder="Confirm Password">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" required> You accept our Terms and Conditions and Privacy Policy
                    </label>
                </div>

                <button type="submit" class="btn" id="submitBtn">Register now →</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Login</a>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <script>
        function selectUserType(type) {
            document.getElementById('userType').value = type;
            document.getElementById('freelancer-btn').classList.toggle('active', type === 'freelancer');
            document.getElementById('client-btn').classList.toggle('active', type === 'client');
        }

        async function handleSignup(event) {
            event.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error">❌ Passwords do not match</div>';
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';
            messageDiv.innerHTML = '<div class="loading">⏳ Creating your account...</div>';

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: password,
                user_type: document.getElementById('userType').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.innerHTML = '<div class="result-card" style="border-left-color: #28a745;"><p style="color: #28a745; font-weight: bold;">✅ ' + result.message + '</p><p style="margin-top: 10px;">Redirecting to dashboard...</p></div>';
                    
                    // Save user data to sessionStorage
                    sessionStorage.setItem('userId', result.user_id);
                    sessionStorage.setItem('userType', data.user_type);
                    sessionStorage.setItem('username', data.name);
                    sessionStorage.setItem('email', data.email);
                    
                    // Redirect to appropriate dashboard
                    setTimeout(() => {
                        if (data.user_type === 'freelancer') {
                            window.location.href = '/freelancer-dashboard';
                        } else {
                            window.location.href = '/client-dashboard';
                        }
                    }, 1500);
                } else {
                    messageDiv.innerHTML = '<div class="error">❌ ' + result.message + '</div>';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>

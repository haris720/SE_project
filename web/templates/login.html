<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Freelancer Platform</title>
    <link rel="stylesheet" href="/static/style.css?v=4.0">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="top-navbar-container">
            <a href="/" class="navbar-logo">
                <span>🆓</span> Freeio
            </a>
            <div class="navbar-menu">
                <a href="/">Home</a>
                <a href="#">Browse Jobs</a>
                <a href="#">Users</a>
                <a href="#">Blog</a>
                <a href="#">Pages</a>
            </div>
            <div class="navbar-actions">
                <a href="/login" class="navbar-btn navbar-btn-login">Login</a>
                <a href="/signup" class="navbar-btn navbar-btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Login Page Content -->
    <div class="auth-page">
        <div class="auth-card">
            <h1>Login</h1>
            <p class="subtitle">Access your account to continue</p>
            
            <div class="user-type-tabs">
                <button class="user-tab active" onclick="selectUserType('freelancer')" id="freelancer-btn">
                    👨‍💻 Freelancer
                </button>
                <button class="user-tab" onclick="selectUserType('client')" id="client-btn">
                    💼 Client
                </button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="hidden" id="userType" value="freelancer">
                
                <div class="form-group">
                    <label for="username">Email *</label>
                    <input type="email" id="username" required placeholder="Email">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="Password">
                </div>

                <button type="submit" class="btn">Login →</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <script>
        function selectUserType(type) {
            document.getElementById('userType').value = type;
            document.getElementById('freelancer-btn').classList.toggle('active', type === 'freelancer');
            document.getElementById('client-btn').classList.toggle('active', type === 'client');
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '<div class="loading">⏳ Logging in...</div>';

            const data = {
                email: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    // Store user data in session
                    sessionStorage.setItem('userType', result.user.user_type);
                    sessionStorage.setItem('username', result.user.name);
                    sessionStorage.setItem('email', result.user.email);
                    sessionStorage.setItem('userId', result.user.user_id);
                    
                    // Redirect based on user type
                    if (result.user.user_type === 'freelancer') {
                        window.location.href = '/freelancer-dashboard';
                    } else {
                        window.location.href = '/client-dashboard';
                    }
                } else {
                    messageDiv.innerHTML = '<div class="error">❌ ' + result.message + '</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
